# Read by the OpenTelemetry Java agent via OTEL_CONFIG_FILE. Naming this file
# makes the agent ignore every other OTEL_* variable, so all of its
# configuration has to live here.
file_format: "1.0"
# Declarative configuration, unlike the environment variables it replaces, does
# not default to W3C propagation: without this the agent injects no traceparent
# and every service starts its own trace.
propagator:
  composite_list: "tracecontext,baggage"
resource:
  attributes:
    - name: service.name
      value: sdc-fe
tracer_provider:
  processors:
    - batch:
        exporter:
          otlp_grpc:
            endpoint: {{ .Values.global.tracing.collector.baseUrl }}:{{ .Values.global.tracing.collector.port.otlpGrpc }}
  sampler:
    parent_based:
      root:
        rule_based_routing:
          span_kind: SERVER
          fallback_sampler:
            # The client spans are the roots here: nothing wraps the health
            # check thread, so each of its three outgoing calls starts its own
            # trace. Dropping them takes the sdc-be and sdc-onboarding-be spans
            # underneath with them.
            rule_based_routing:
              span_kind: CLIENT
              fallback_sampler:
                trace_id_ratio_based:
                  ratio: "{{ .Values.global.tracing.sampling.probability }}"
              rules:
                - attribute: url.full
                  pattern: (?i)^https?://.*/health-?check$
                  action: DROP
          # /sdc1/rest/healthCheck is what the probe script calls, and
          # /onboarding/v1.0/healthcheck is the health check proxied to
          # sdc-onboarding-be.
          rules:
            - attribute: url.path
              pattern: (?i)^/(sdc1/rest/healthcheck|onboarding/v1\.0/healthcheck)$
              action: DROP
meter_provider:
  readers: []
logger_provider:
  processors: []
