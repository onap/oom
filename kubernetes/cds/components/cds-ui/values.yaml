#################################################################
# Global configuration defaults.
#################################################################
global:
  nodePortPrefixExt: 304

# application image
image: onap/ccsdk-cds-ui-server:1.10.0
pullPolicy: Always

# application configuration
config:
  env:
    protocol: HTTP
  app:
    action:
      deployBlueprint:
        grpcEnabled: true
  api:
    controller:
      http:
       baseUrl: http://cds-blueprints-processor-http:8081/api/v1
       authToken: Basic Y2NzZGthcHBzOmNjc2RrYXBwcw==
    processor:
      http:
       baseUrl: http://cds-blueprints-processor-http:8080/api/v1
       authToken: Basic Y2NzZGthcHBzOmNjc2RrYXBwcw==
      grpc:
        host: cds-blueprints-processor-grpc
        port: 9111
        authToken: Basic Y2NzZGthcHBzOmNjc2RrYXBwcw==

# default number of instances
replicaCount: 1

nodeSelector: {}

affinity: {}

# probe configuration parameters
startup:
  httpGet:
    path: /ping
    port: 3000
  periodSeconds: 5
  failureThreshold: 24

liveness:
  httpGet:
    path: /
    port: 3000
  periodSeconds: 10
  # necessary to disable liveness probe when setting breakpoints
  # in debugger so K8s doesn't restart unresponsive container
  enabled: true

readiness:
  httpGet:
    path: /ping
    port: 3000
  periodSeconds: 10

service:
  type: NodePort
  name: cds-ui
  internalPort: 3000
  ports:
    - name: http
      port: 3000
      nodePort: 97
      useNodePortExt: true

ingress:
  enabled: false
  service:
    - baseaddr: "cds-ui"
      name: "cds-ui"
      port: 3000
      config:
        ssl: "redirect"

# Resource Limit flavor -By Default using small
flavor: small
# Segregation for Different environment (Small and Large)
resources:
  small:
    limits:
      cpu: "1"
      memory: "200Mi"
    requests:
      cpu: "200m"
      memory: "200Mi"
  large:
    limits:
      cpu: "2"
      memory: "200Mi"
    requests:
      cpu: "1"
      memory: "200Mi"
  unlimited: {}

secrets:
  - uid: api-auth-tokens
    type: genericKV
    envs:
      - name: controllerHttpAuthToken
        value: '{{ .Values.config.api.controller.http.authToken }}'
        policy: required
      - name: processorHttpAuthToken
        value: '{{ .Values.config.api.processor.http.authToken }}'
        policy: required
      - name: processorGrpcAuthToken
        value: '{{ .Values.config.api.processor.grpc.authToken }}'
        policy: required

# uploaded CBAs are buffered in /tmp before they are passed to the blueprints-processor
tmpSizeLimit: 500Mi

securityContext:
  user_id: 1000
  group_id: 1000

#Pods Service Account
serviceAccount:
  nameOverride: cds-ui
  roles:
    - read
