#################################################################
# Global configuration defaults.
#################################################################
global:
  nodePortPrefixExt: 304
  persistence:
    mountPath: /dockerdata-nfs
  security:
    aaf:
      enabled: false
  tracing:
    enabled: false
    collector:
      baseUrl: http://jaeger-collector.istio-config
      port:
        zipkin: 9411
        otlpGrpc: 4317
        grpc: 14250
    sampling:
      probability: 1.0 # percentage of requests that are sampled (between 0-1/0%-100%)
  auth:
    aai:
      users:
      - username: aai@aai.onap.org
        password: demo123456!
    so:
      users:
      - username: InfraPortalClient
        password: password1$
      - username: bpel
        password: password1$

#################################################################
# Application configuration defaults.
#################################################################
image: onap/so/so-etsi-sol003-adapter:1.13.1-20261028T1032
pullPolicy: Always

sdc:
  username: mso
  password: Kp8bJ4SXszM0WXlhak3eHlcse2gAw84vaoGGmJvUy2U

replicaCount: 1
minReadySeconds: 10
containerPort: &containerPort 9092
logPath: ./logs/etsi-sol003-adapter/
app: etsi-sol003-adapter
jvmArgs: "-XX:MaxRAMPercentage=50.0"
service:
  type: NodePort
  annotations:
    service.alpha.kubernetes.io/tolerate-unready-endpoints: 'true'
    msb.onap.org/service-info: |
      {{ if .Values.global.msbEnabled -}}[
        {
          "serviceName": "{{ include "common.servicename" . }}",
          "version": "v1",
          "url": "/so/vnfm-adapter/v1",
          "protocol": "REST",
          "port": "{{.Values.containerPort}}",
          "visualRange":"1"
        }
      ]{{ end }}
  ports:
    - name: http
      port: *containerPort
      nodePort: "06"

updateStrategy:
  type: RollingUpdate
  maxUnavailable: 1
  maxSurge: 1

#################################################################
# soHelpers part
#################################################################
soHelpers:
  containerPort: *containerPort

# Resource Limit flavor -By Default using small
flavor: small
# Segregation for Different environment (Small, Medium and Large)
resources:
  small:
    limits:
      cpu: "1"
      memory: "768Mi"
    requests:
      cpu: "300m"
      memory: "614Mi"
  medium:
    limits:
      cpu: "1"
      memory: "768Mi"
    requests:
      cpu: "300m"
      memory: "384Mi"
  large:
    limits:
      cpu: "2"
      memory: "1.5Gi"
    requests:
      cpu: "1"
      memory: "768Mi"
  unlimited: {}
livenessProbe:
  port: 9092
  initialDelaySeconds: 600
  periodSeconds: 60
  timeoutSeconds: 10
  successThreshold: 1
  failureThreshold: 3
ingress:
  enabled: false
  service:
  - baseaddr: "so-etsi-sol003-adapter-api"
    name: "so-etsi-sol003-adapter"
    port: 9092
  config:
    ssl: "redirect"
serviceMesh:
  authorizationPolicy:
    authorizedPrincipals:
      - serviceAccount: robot-read
      - serviceAccount: so-bpmn-infra-read
      - serviceAccount: so-etsi-nfvo-ns-lcm-read
      - serviceAccount: so-read
      - serviceAccount: istio-ingress
        namespace: istio-ingress
nodeSelector: {}
tolerations: []
affinity: {}

#Pods Service Account
serviceAccount:
  nameOverride: so-etsi-sol003-adapter
  roles:
    - read

tracing: {}
  # ignorePatterns:
  #   - ""
