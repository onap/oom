aai:
  username: {{ (index .Values.global.auth.aai.users 0).username }}
  password: {{ (index .Values.global.auth.aai.users 0).password | quote }}
logging:
  path: logs
spring:
  application:
    name: so-etsi-sol005-adapter
  datasource:
    hikari:
       driver-class-name: org.mariadb.jdbc.Driver
       jdbcUrl: jdbc:mariadb://${DB_HOST}:${DB_PORT}/requestdb
       username: ${DB_USERNAME}
       password: ${DB_PASSWORD}
       pool-name: reqdb-pool
       registerMbeans: true
  security:
    usercredentials: {{ include "so.helpers.userCredentials" . }}
server:
    {{- if include "common.onServiceMesh" . }}
    forward-headers-strategy: none
    {{- end }}
    port: {{ index .Values.containerPort }}
    tomcat:
        max-threads: 50
mso:
  site-name: localSite
  logPath: ./logs/etsi-sol005-adapter
  msb-ip: msb-iag
  msb-port: 80
  adapters:
    requestDb:
      endpoint: http://so-request-db-adapter.{{ include "common.namespace" . }}:8083
#Actuator
management:
  security:
    enabled: false
    basic:
      enabled: false
