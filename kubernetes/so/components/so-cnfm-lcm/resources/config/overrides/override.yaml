aai:
  username: {{ (index .Values.global.auth.aai.users 0).username }}
  password: {{ (index .Values.global.auth.aai.users 0).password | quote }}
  version: v24
  endpoint: http://aai.{{ include "common.namespace" . }}:80
spring:
  application:
    name: so-cnfm-lcm
  datasource:
    hikari:
      camunda:
        jdbcUrl: jdbc:mariadb://${DB_HOST}:${DB_PORT}/camundabpmn
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}
        driver-class-name: org.mariadb.jdbc.Driver
        pool-name: bpmn-pool
        registerMbeans: true
      cnfm:
        jdbcUrl: jdbc:mariadb://${DB_HOST}:${DB_PORT}/cnfm
        username: ${DB_ADMIN_USERNAME}
        password: ${DB_ADMIN_PASSWORD}
        driver-class-name: org.mariadb.jdbc.Driver
        pool-name: cnfm-pool
        registerMbeans: true
management:
  observations:
    enable:
      # Every request, the liveness probe included, gets four Spring Security spans that
      # carry no URI, so they cannot be filtered by path like the HTTP server span
      spring.security: false
      tasks.scheduled.execution: false
  tracing:
    enabled: {{ .Values.global.tracing.enabled }}
    sampling:
      probability: {{ .Values.global.tracing.sampling.probability }}
    propagation:
      type:
        - w3c
        - b3
  otlp:
    tracing:
      endpoint: {{ .Values.global.tracing.collector.baseUrl }}:{{ .Values.global.tracing.collector.port.otlpHttp }}/v1/traces
server:
  port: {{ .Values.containerPort }}
  tomcat:
    max-threads: 50
sdc:
  username: {{ .Values.sdc.username }}
  password: {{ .Values.sdc.password | quote }}
  endpoint: http://sdc-be.{{ include "common.namespace" . }}:8080
camunda:
  bpm:
    history-level: full
    job-execution:
      max-pool-size: 30
      core-pool-size: 3
      deployment-aware: true
