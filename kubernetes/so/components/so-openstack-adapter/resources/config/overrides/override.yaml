aai:
  username: {{ (index .Values.global.auth.aai.users 0).username }}
  password: {{ (index .Values.global.auth.aai.users 0).password | quote }}
  endpoint: http://aai.{{ include "common.namespace" . }}:80
server:
  {{- if include "common.onServiceMesh" . }}
  forward-headers-strategy: none
  {{- end }}
  port: {{ index .Values.containerPort }}
SW  port: {{ index .Values.containerPort }}
spring:
  application:
    name: so-openstack-adapter
  datasource:
    hikari:
      jdbcUrl: jdbc:mariadb://${DB_HOST}:${DB_PORT}/catalogdb
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
      driver-class-name: org.mariadb.jdbc.Driver
      pool-name: catdb-pool
      registerMbeans: false
  security:
    usercredentials: {{ include "so.helpers.userCredentials" . }}
management:
  observations:
    enable:
      # Every request, the liveness probe included, gets four Spring Security spans that
      # carry no URI, so they cannot be filtered by path like the HTTP server span
      spring.security: false
      tasks.scheduled.execution: false
  tracing:
    enabled: {{ .Values.global.tracing.enabled }}
    sampling:
      probability: {{ .Values.global.tracing.sampling.probability }}
    propagation:
      type:
        - w3c
        - b3
  otlp:
    tracing:
      endpoint: {{ .Values.global.tracing.collector.baseUrl }}:{{ .Values.global.tracing.collector.port.otlpHttp }}/v1/traces
org:
  onap:
    so:
      adapters:
        {{- if eq .Values.config.openStackKeystoneVersion "KEYSTONE_V3" }}
        default_keystone_url_version: /v3
        {{- else }}
        default_keystone_url_version: /v2.0
        {{- end }}
        default_keystone_reg_ex: "/[vV][0-9]"
        vnf:
          checkRequiredParameters: true
          addGetFilesOnVolumeReq: false
          sockettimeout: 30
          connecttimeout: 30
          retrycount: 5
          retryinterval: -15
          retrylist: 408,429,500,502,503,504,900
          valet_enabled: false
          fail_requests_on_valet_failure: false
        network:
          sockettimeout: 5
          connecttimeout: 5
          retrycount: 5
          retryinterval: -15
          retrylist: 408,429,500,502,503,504,900
        tenant:
          {{- if eq .Values.config.openStackKeystoneVersion "KEYSTONE_V3" }}
          default_keystone_url_version: /v3
          {{- else }}
          default_keystone_url_version: /v2.0
          {{- end }}
          default_keystone_reg_ex: "/[vV][0-9]"
          default_tenant_description: Tenant
          default_region_type: single
          default_user_role: admin
          default_success_status_string: Success
          default_no_regions_status_string: no regions
          default_quota_value: 10
          set_default_quota: false
ecomp:
  mso:
    adapters:
      po:
        retryCodes: 504
        retryDelay: 5
        retryCount: 3
        pollTimeout: 7500
        pollInterval: 15
so:
  auth:
    username: {{ (index .Values.global.auth.so.users 0).username }}
    password: {{ (index .Values.global.auth.so.users 0).password | quote }}
multicloud:
  endpoint: http://multicloud-k8s.{{ include "common.namespace" . }}:9015
mso:
  adapters:
    requestDb:
      endpoint: http://so-request-db-adapter.{{ include "common.namespace" . }}:8083
  logPath: ./logs/openstack
  msb-ip: msb-iag
  msb-port: 80
  msb-scheme: http
  workflow:
    endpoint: http://so-bpmn-infra.{{ include "common.namespace" . }}:8081/sobpmnengine
  catalog:
    db:
      spring:
        endpoint: http://so-catalog-db-adapter.{{ include "common.namespace" . }}:8082
  site-name: localDevEnv
  async:
    core-pool-size: 50
    max-pool-size: 50
    queue-capacity: 500
