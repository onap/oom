apiVersion: apps/v1
kind: Deployment
metadata: {{- include "common.resourceMetadata" . | nindent 2 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector: {{- include "common.selectors" . | nindent 4 }}
  template:
    metadata: {{- include "common.templateMetadata" . | nindent 6 }}
    spec:
      {{ include "common.podSecurityContext" . | indent 6 | trim }}
      containers:
        - name: {{ include "common.name" . }}
          {{ include "common.containerSecurityContext" . | indent 10 | trim }}
          image: {{ include "repositoryGenerator.repository" . }}/{{ .Values.image }}
          imagePullPolicy: {{ .Values.global.pullPolicy | default .Values.pullPolicy }}
          ports: {{- include "common.containerPorts" . | nindent 12 }}
          startupProbe:
            httpGet:
              path: {{ .Values.startup.httpGet.path }}
              port: {{ .Values.startup.httpGet.port }}
            periodSeconds: {{ .Values.startup.periodSeconds }}
            failureThreshold: {{ .Values.startup.failureThreshold }}
          # disable liveness probe when breakpoints set in debugger
          # so K8s doesn't restart unresponsive container
          {{ if .Values.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.liveness.httpGet.path }}
              port: {{ .Values.liveness.httpGet.port }}
            periodSeconds: {{ .Values.liveness.periodSeconds }}
          {{ end }}
          env:
            - name: HOST
              value: 0.0.0.0
            - name: PROTOCOL
              value: "{{ .Values.config.env.protocol }}"
            - name: APP_ACTION_DEPLOY_BLUEPRINT_GRPC_ENABLED
              value: "{{ .Values.config.app.action.deployBlueprint.grpcEnabled }}"
            - name: API_BLUEPRINT_CONTROLLER_HTTP_BASE_URL
              value: {{ .Values.config.api.controller.http.baseUrl }}
            - name: API_BLUEPRINT_CONTROLLER_HTTP_AUTH_TOKEN
              {{- include "common.secret.envFromSecretFast" (dict "global" . "uid" "api-auth-tokens" "key" "controllerHttpAuthToken") | indent 14 }}
            - name: API_BLUEPRINT_PROCESSOR_HTTP_BASE_URL
              value: {{ .Values.config.api.processor.http.baseUrl }}
            - name: API_BLUEPRINT_PROCESSOR_HTTP_AUTH_TOKEN
              {{- include "common.secret.envFromSecretFast" (dict "global" . "uid" "api-auth-tokens" "key" "processorHttpAuthToken") | indent 14 }}
            - name: API_BLUEPRINT_PROCESSOR_GRPC_HOST
              value: {{ .Values.config.api.processor.grpc.host }}
            - name: API_BLUEPRINT_PROCESSOR_GRPC_PORT
              value: "{{ .Values.config.api.processor.grpc.port }}"
            - name: API_BLUEPRINT_PROCESSOR_GRPC_AUTH_TOKEN
              {{- include "common.secret.envFromSecretFast" (dict "global" . "uid" "api-auth-tokens" "key" "processorGrpcAuthToken") | indent 14 }}
          readinessProbe:
            httpGet:
              path: {{ .Values.readiness.httpGet.path }}
              port: {{ .Values.readiness.httpGet.port }}
            periodSeconds: {{ .Values.readiness.periodSeconds }}
          volumeMounts:
          - mountPath: /tmp
            name: tmp
          resources: {{ include "common.resources" . | nindent 12 }}
      {{- if .Values.nodeSelector }}
      nodeSelector: {{ toYaml .Values.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity: {{ toYaml .Values.affinity | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "common.fullname" (dict "suffix" "read" "dot" . )}}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.tmpSizeLimit }}
      {{- include "common.imagePullSecrets" . | nindent 6 }}
