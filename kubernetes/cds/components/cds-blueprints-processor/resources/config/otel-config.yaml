# Read by the OpenTelemetry Java agent via OTEL_EXPERIMENTAL_CONFIG_FILE. Naming
# this file makes the agent ignore the OTEL_* SDK variables (exporter, sampler,
# service name), so that configuration has to live here. Agents before 2.26 do
# not read OTEL_CONFIG_FILE and silently fall back to their defaults.
file_format: "1.0"
# Declarative configuration, unlike the environment variables it replaces, does
# not default to W3C propagation: without this the agent injects no traceparent
# and every service starts its own trace.
propagator:
  composite_list: "tracecontext,baggage"
resource:
  attributes:
    - name: service.name
      value: cds-blueprints-processor
tracer_provider:
  processors:
    - batch:
        exporter:
          otlp_grpc:
            endpoint: {{ .Values.global.tracing.collector.baseUrl }}:{{ .Values.global.tracing.collector.port.otlpGrpc }}
  sampler:
    parent_based:
      root:
        rule_based_routing:
          span_kind: SERVER
          fallback_sampler:
            trace_id_ratio_based:
              ratio: "{{ .Values.global.tracing.sampling.probability }}"
          # The path the startup, liveness and readiness probes call.
          rules:
            - attribute: url.path
              pattern: ^/api/v1/execution-service/health-check$
              action: DROP
meter_provider:
  readers: []
logger_provider:
  processors: []
