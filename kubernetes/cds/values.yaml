#################################################################
# Global configuration defaults.
#################################################################
global:
  nodePortPrefix: 302
  nodePortPrefixExt: 304
  persistence:
    mountPath: /dockerdata-nfs
  postgres:
    localCluster: true
    # flag to enable the DB creation via pgo-operator
    useOperator: false
    service:
      name: &postgresName cds-postgres
      name2: &postgresName2 cds-pg-primary
      name3: &postgresName3 cds-pg-replica
      port: &postgresPort 5432
    nameOverride: *postgresName
    # (optional) if localCluster=false and an external secret is used set this variable
    #userRootSecret: <secretName>
  tracing:
    enabled: false
    collector:
      baseUrl: http://jaeger-collector.istio-config
      port:
        zipkin: 9411
        otlpGrpc: 4317
        otlpHttp: 4318
        grpc: 14250
    sampling:
      probability: 1.0 # percentage of requests that are sampled (between 0-1/0%-100%)


#################################################################
# Secrets metaconfig
#################################################################
secrets:
  - uid: db-root-password
    name: &dbRootPassSecretName '{{ include "common.release" . }}-cds-db-root-password'
    type: password
    externalSecret: '{{ .Values.global.postgres.localCluster | ternary
                 ( hasSuffix "cds-db-root-password" (index .Values "postgres" "config" "pgRootPasswordExternalSecret") | ternary
                   ""
                   (tpl (default "" (index .Values "postgres" "config" "pgRootPasswordExternalSecret")) .)
                 )
                 ( not (empty (default "" .Values.global.postgres.userRootSecret)) | ternary
                   .Values.global.postgres.userRootSecret
                   (include "common.postgres.secret.rootPassSecretName"
                     (dict "dot" . "chartName" .Values.global.postgres.nameOverride)
                   )
                 )
               }}'
    password: '{{ (index .Values "postgres" "config" "pgRootPassword") }}'
    policy: generate
  - name: &dbUserSecretName '{{ include "common.release" . }}-cds-db-secret'
    uid: 'cds-db-secret'
    type: basicAuth
    externalSecret: '{{ hasSuffix "cds-db-secret" (index .Values "postgres" "config" "pgUserExternalSecret") | ternary
                        ""
                        (tpl (default "" (index .Values "postgres" "config" "pgUserExternalSecret")) .)
                     }}'
    login: '{{ (index .Values "postgres" "config" "pgUserName") }}'
    password: '{{ (index .Values "postgres" "config" "pgUserPassword") }}'
    passwordPolicy: generate

#################################################################
# Application configuration defaults.
#################################################################
# application images
pullPolicy: Always

subChartsOnly:
  enabled: true

# flag to enable debugging - application support required
debugEnabled: false

# default number of instances
replicaCount: 1

nodeSelector: {}

affinity: {}

# probe configuration parameters
liveness:
  initialDelaySeconds: 20
  periodSeconds: 20
  timeoutSeconds: 20
  # necessary to disable liveness probe when setting breakpoints
  # in debugger so K8s doesn't restart unresponsive container
  enabled: true

readiness:
  initialDelaySeconds: 10
  periodSeconds: 10

ingress:
  enabled: false

postgres:
  nameOverride: *postgresName
  service:
    name: *postgresName
    name2: *postgresName2
    name3: *postgresName3
    internalPort: *postgresPort
  container:
    name:
      primary: *postgresName2
      replica: *postgresName3
  persistence:
    mountSubPath: cds/postgres/data
    mountInitPath: cds
    size: 3Gi
  config:
    pgUserName: sdnctl
    pgDatabase: &dbName sdnctl
    pgUserExternalSecret: *dbUserSecretName
    pgRootPasswordExternalSecret: *dbRootPassSecretName

cds-blueprints-processor:
  enabled: true
  config:
    cdsDB:
      dbName: *dbName
      dbCredsExternalSecret: *dbUserSecretName

cds-command-executor:
  enabled: true

cds-py-executor:
  enabled: true

cds-sdc-listener:
  enabled: true

cds-ui:
  enabled: true

#Resource Limit flavor -By Default using small
flavor: small
#segregation for different environment (Small and Large)
resources:
  small:
    limits:
      cpu: "2"
      memory: "4Gi"
    requests:
      cpu: "1"
      memory: "2Gi"
  large:
    limits:
      cpu: "4"
      memory: "8Gi"
    requests:
      cpu: "2"
      memory: "4Gi"
  unlimited: {}
