kind: StatefulSet
apiVersion: apps/v1
metadata: {{- include "common.resourceMetadata" . | nindent 2 }}
spec:
  serviceName: {{ include "common.servicename" . }}
  replicas: {{ index .Values.replicaCount }}
  selector: {{- include "common.selectors" . | nindent 4 }}
  template:
    metadata:
      labels: {{- include "common.labels" . | nindent 8 }}
      annotations:
        checksum/policy-conf: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
    spec:
      {{- include "common.imagePullSecrets" . | nindent 6 }}
      initContainers:
      - name: {{ include "common.name" . }}-bootstrap-config
        image: {{ include "repositoryGenerator.repository" . }}/{{ .Values.image }}
        imagePullPolicy: {{ .Values.global.pullPolicy | default .Values.pullPolicy }}
        command: ["cp", "/config-input/application_configuration.json", "/config/application_configuration.json"]
        volumeMounts:
        - mountPath: /config-input
          name: {{ include "common.fullname" . }}-policy-conf-secret
        - mountPath: /config
          name: config
        securityContext:
          runAsUser: {{ .Values.mainUserId }}
          runAsGroup: {{ .Values.mainGroupId }}
          runAsNonRoot: true
      containers:
      - name: {{ include "common.name" . }}
        image: {{ include "repositoryGenerator.repository" . }}/{{ .Values.image }}
        imagePullPolicy: {{ .Values.global.pullPolicy | default .Values.pullPolicy }}
        ports: {{ include "common.containerPorts" . | nindent 10  }}
        readinessProbe:
          tcpSocket:
            port: {{ .Values.readiness.port }}
          initialDelaySeconds: {{ .Values.readiness.initialDelaySeconds }}
          periodSeconds: {{ .Values.readiness.periodSeconds }}
        livenessProbe:
          tcpSocket:
            port: {{ .Values.liveness.port }}
          initialDelaySeconds: {{ .Values.liveness.initialDelaySeconds }}
          periodSeconds: {{ .Values.liveness.periodSeconds }}
        volumeMounts:
        - name: {{ include "common.fullname" . }}-policy-conf-input
          mountPath: /opt/app/policy-agent/logback-plain.xml
          subPath: logback-plain.xml
        - name: config
          mountPath: /opt/app/policy-agent/data/application_configuration.json
          subPath: application_configuration.json
        - name: {{ include "common.fullname" . }}-policy-conf-input
          mountPath: /opt/app/policy-agent/config/application.yaml
          subPath: application.yaml
        - name: {{ include "common.fullname" . }}
          mountPath: "/var/policy-management-service/database"
        resources: {{ include "common.resources" . | nindent 10 }}
        securityContext:
          runAsUser: {{ .Values.mainUserId }}
          runAsGroup: {{ .Values.mainGroupId }}
          runAsNonRoot: true
      serviceAccountName: {{ include "common.fullname" (dict "suffix" "read" "dot" . )}}
      volumes:
        - name: {{ include "common.fullname" . }}-policy-conf-input
          configMap:
            name: {{ include "common.fullname" . }}-policy-conf
        - name: {{ include "common.fullname" . }}-policy-conf-secret
          secret:
            secretName: {{ include "common.fullname" . }}-policy-conf
        - name: config
          emptyDir:
            medium: Memory
{{- if not .Values.persistence.enabled }}
        - name: {{ include "common.fullname" . }}
          emptyDir: {}
{{- else }}
  volumeClaimTemplates:
    - {{include "common.PVCTemplate" . | indent 6 | trim }}
{{- end }}
