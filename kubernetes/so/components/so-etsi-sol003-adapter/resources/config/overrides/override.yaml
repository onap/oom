aai:
  username: {{ (index .Values.global.auth.aai.users 0).username }}
  password: {{ (index .Values.global.auth.aai.users 0).password | quote }}
  version: v15
  endpoint: http://aai.{{ include "common.namespace" . }}:80
spring:
  application:
    name: so-etsi-sol003-adapter
  security:
    usercredentials: {{ include "so.helpers.userCredentials" . }}
  sleuth:
    enabled: {{ .Values.global.tracing.enabled }}
    trace-id128: true
    sampler:
      probability: {{ .Values.global.tracing.sampling.probability }}
    supports-join: false
    propagation:
      type:
      - w3c
      - b3
    web:
      skip-pattern: {{ join "," .Values.tracing.ignorePatterns }}
  zipkin:
    base-url: {{ .Values.global.tracing.collector.baseUrl }}:{{ .Values.global.tracing.collector.port.zipkin }}
server:
  {{- if include "common.onServiceMesh" . }}
  forward-headers-strategy: none
  {{- end }}
  port: {{ index .Values.containerPort }}
  ssl:
    enabled: false
mso:
  site-name: localSite
  logPath: ./logs/etsi-sol003-adapter
  msb-ip: msb-iag
  msb-port: 80
sdc:
  username: {{ .Values.sdc.username }}
  password: {{ .Values.sdc.password | quote }}
  endpoint: http://sdc-be.{{ include "common.namespace" . }}:8080
vnfmadapter:
  endpoint: http://so-etsi-sol003-adapter.{{ include "common.namespace" . }}:9092
etsi-catalog-manager:
  vnfpkgm:
  {{- if .Values.global.msbEnabled }}
    endpoint: http://msb-iag:80/api
  {{- else }}
    endpoint: http://modeling-etsicatalog.{{ include "common.namespace" . }}:8806/api/vnfpkgm/v1
  {{- end }}
