#################################################################
# Global configuration defaults.
#################################################################
global:
  persistence: {}

#################################################################
# Application configuration defaults.
#################################################################
image: mongo:8.0.34
pullPolicy: IfNotPresent

service:
  type: ClusterIP
  ports:
    - name: tcp-mongodb
      port: 27017

persistence:
  enabled: true
  # empty uses the cluster's default StorageClass
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 8Gi
  mountPath: /var/lib/mongodb

# probe configuration parameters
liveness:
  initialDelaySeconds: 30
  periodSeconds: 20
  timeoutSeconds: 10
  failureThreshold: 6
  # necessary to disable liveness probe when setting breakpoints
  # in debugger so K8s doesn't restart unresponsive container
  enabled: true

readiness:
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

securityContext:
  user_id: 1001
  group_id: 1001

volumes:
  tmpSizeLimit: 64Mi

flavor: small
resources:
  small:
    limits:
      cpu: "1"
      memory: "1Gi"
    requests:
      cpu: "250m"
      memory: "512Mi"
  large:
    limits:
      cpu: "2"
      memory: "4Gi"
    requests:
      cpu: "500m"
      memory: "1Gi"
  unlimited: {}

nodeSelector: {}
tolerations: []
affinity: {}
