apiVersion: apps/v1
kind: Deployment
metadata: {{- include "common.resourceMetadata" . | nindent 2 }}
spec:
  selector: {{- include "common.selectors" . | nindent 4 }}
  replicas: {{ .Values.replicaCount }}
  template:
    metadata: {{- include "common.templateMetadata" . | nindent 6 }}
    spec:
      initContainers:
      - name: {{ include "common.name" . }}-copy-settings
        image: {{ include "repositoryGenerator.repository" . }}/{{ .Values.image }}
        imagePullPolicy: {{ .Values.global.pullPolicy | default .Values.pullPolicy }}
        command: ["cp", "/config-input/customSettings.js", "/config/customSettings.js"]
        volumeMounts:
        - mountPath: /config-input
          name: config-input
        - mountPath: /config
          name: config
      {{ include "common.readinessCheck.waitFor" . | indent 6 | trim }}
      containers:
        - name: {{ include "common.name" . }}
          image: {{ include "repositoryGenerator.repository" . }}/{{ .Values.image }}
          imagePullPolicy: {{ .Values.global.pullPolicy | default .Values.pullPolicy }}
          command: ["/bin/bash"]
          args: ["-c", "cd /opt/onap/ccsdk/dgbuilder/ && ./start.sh sdnc1.0 && wait"]
          ports: {{- include "common.containerPorts" . | indent 10 }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.service.internalPort }}
            initialDelaySeconds: {{ .Values.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.readiness.periodSeconds }}
          env:
          - name: SDNC_CONFIG_DIR
            value: /opt/onap/sdnc/data/properties
          - name: DB_USER
            {{- include "common.secret.envFromSecretFast" (dict "global" . "uid" "db-user-creds" "key" "login") | indent 12 }}
          - name: DB_PASSWORD
            {{- include "common.secret.envFromSecretFast" (dict "global" . "uid" "db-user-creds" "key" "password") | indent 12 }}
          - name: HTTP_USER
            {{- include "common.secret.envFromSecretFast" (dict "global" . "uid" "http-user-creds" "key" "login") | indent 12 }}
          - name: HTTP_PASSWORD
            {{- include "common.secret.envFromSecretFast" (dict "global" . "uid" "http-user-creds" "key" "password") | indent 12 }}
          - name: HTTP_ADMIN_USER
            {{- include "common.secret.envFromSecretFast" (dict "global" . "uid" "admin-creds" "key" "login") | indent 12 }}
          - name: HTTP_ADMIN_PASSWORD
            {{- include "common.secret.envFromSecretFast" (dict "global" . "uid" "admin-creds" "key" "password") | indent 12 }}
          - name: HTTP_NODE_USER
            {{- include "common.secret.envFromSecretFast" (dict "global" . "uid" "node-creds" "key" "login") | indent 12 }}
          - name: HTTP_NODE_PASSWORD
            {{- include "common.secret.envFromSecretFast" (dict "global" . "uid" "node-creds" "key" "password") | indent 12 }}
          - name: REST_CONF_USER
            {{- include "common.secret.envFromSecretFast" (dict "global" . "uid" "restconf-creds" "key" "login") | indent 12 }}
          - name: REST_CONF_PASSWORD
            {{- include "common.secret.envFromSecretFast" (dict "global" . "uid" "restconf-creds" "key" "password") | indent 12 }}
          volumeMounts:
          - name: config
            mountPath: /opt/app/application.properties
            subPath: application.properties
          - name: config-input
            mountPath: /opt/onap/ccsdk/dgbuilder/releases/sdnc1.0/conf/svclogic.properties
            subPath: svclogic.properties
          - name: config-input
            mountPath: /opt/onap/ccsdk/dgbuilder/svclogic/svclogic.properties
            subPath: svclogic.properties
          - name: config
            mountPath: /opt/onap/ccsdk/dgbuilder/releases/sdnc1.0/customSettings.js
            subPath: customSettings.js
          resources: {{ include "common.resources" . | nindent 12 }}
        {{- if .Values.nodeSelector }}
        nodeSelector:
{{ toYaml .Values.nodeSelector | indent 10 }}
        {{- end -}}
        {{- if .Values.affinity }}
        affinity:
{{ toYaml .Values.affinity | indent 10 }}
        {{- end }}
      serviceAccountName: {{ include "common.fullname" (dict "suffix" "read" "dot" . )}}
      volumes:
        - name: config-input
          configMap:
            name: {{ include "common.fullname" . }}-config
        - name: config
          emptyDir:
            medium: Memory
      {{- include "common.imagePullSecrets" . | nindent 6 }}
