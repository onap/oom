# Read by the OpenTelemetry Java agent via OTEL_EXPERIMENTAL_CONFIG_FILE. Naming
# this file makes the agent ignore the OTEL_* SDK variables (exporter, sampler,
# service name), so that configuration has to live here.
file_format: "1.0"
# Declarative configuration does not default to W3C propagation: without this
# the agent reads no traceparent from the SDC notification and starts a new trace.
propagator:
  composite_list: "tracecontext,baggage"
resource:
  attributes:
    - name: service.name
      value: sdnc-ueb-listener
tracer_provider:
  processors:
    - batch:
        exporter:
          otlp_grpc:
            endpoint: {{ .Values.global.tracing.collector.baseUrl }}:{{ .Values.global.tracing.collector.port.otlpGrpc }}
  sampler:
    parent_based:
      root:
        trace_id_ratio_based:
          ratio: "{{ .Values.global.tracing.sampling.probability }}"
meter_provider:
  readers: []
logger_provider:
  processors: []
