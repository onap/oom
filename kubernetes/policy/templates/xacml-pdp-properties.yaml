{{- if (index .Values "policy-xacml-pdp" "enabled") }}
{{/*
  Rendered here and not in policy-xacml-pdp: xacml-pdp reads the JPA credentials
  verbatim from xacml.properties, and only this chart knows the db-secret values.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "common.release" . }}-policy-xacml-pdp-properties
  namespace: {{ include "common.namespace" . }}
  labels: {{- include "common.labels" . | nindent 4 }}
type: Opaque
data:
  xacml.properties: {{ tpl (.Files.Get "resources/xacml-pdp/xacml.properties") . | b64enc | quote }}
{{- end }}
