apiVersion: apps/v1
kind: Deployment
metadata: {{- include "common.resourceMetadata" . | nindent 2 }}
spec:
  selector: {{- include "common.selectors" . | nindent 4 }}
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{ end }}
  strategy:
    type: {{ .Values.updateStrategy.type }}
    rollingUpdate:
      maxUnavailable: {{ .Values.updateStrategy.maxUnavailable }}
      maxSurge: {{ .Values.updateStrategy.maxSurge }}
  template:
    metadata: {{- include "common.templateMetadata" . | nindent 6 }}
    spec:
      {{ include "common.podSecurityContext" . | indent 6 | trim }}
      initContainers:
      {{ include "common.readinessCheck.waitFor" . | nindent 6 }}
      containers:
        - name: {{ include "common.name" . }}
          {{ include "common.containerSecurityContext" . | indent 10 | trim }}
          image: {{ include "repositoryGenerator.repository" . }}/{{ .Values.image }}
          imagePullPolicy: {{ .Values.global.pullPolicy | default .Values.pullPolicy }}
          command: ["/opt/app/policy/pdpx/bin/policy-pdpx.sh"]
          args: ["/opt/app/policy/pdpx/etc/mounted/config.json"]
          env:
          - name: RESTSERVER_USER
            {{- include "common.secret.envFromSecretFast" (dict "global" . "uid" "restserver-creds" "key" "login") | indent 12 }}
          - name: RESTSERVER_PASSWORD
            {{- include "common.secret.envFromSecretFast" (dict "global" . "uid" "restserver-creds" "key" "password") | indent 12 }}
          - name: POD_UID
            valueFrom:
              fieldRef:
                fieldPath: metadata.uid
          - name: GROUP_ID
            value: {{ .Values.groupIdPrefix }}-$(POD_UID)
          ports: {{ include "common.containerPorts" . | nindent 12  }}
          # disable liveness probe when breakpoints set in debugger
          # so K8s doesn't restart unresponsive container
          {{- if eq .Values.liveness.enabled true }}
          livenessProbe:
            tcpSocket:
              port: {{ .Values.service.internalPort }}
            initialDelaySeconds: {{ .Values.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.liveness.periodSeconds }}
          {{ end -}}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.service.internalPort }}
            initialDelaySeconds: {{ .Values.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.readiness.periodSeconds }}
          volumeMounts:
          - name: policy-guard
            mountPath: /opt/app/policy/pdpx/apps/guard
          - name: xacml-properties
            mountPath: /opt/app/policy/pdpx/apps/guard/xacml.properties
            subPath: xacml.properties
          - name: policy-match
            mountPath: /opt/app/policy/pdpx/apps/match
          - name: xacml-properties
            mountPath: /opt/app/policy/pdpx/apps/match/xacml.properties
            subPath: xacml.properties
          - name: policy-monitoring
            mountPath: /opt/app/policy/pdpx/apps/monitoring
          - name: xacml-properties
            mountPath: /opt/app/policy/pdpx/apps/monitoring/xacml.properties
            subPath: xacml.properties
          - name: policy-naming
            mountPath: /opt/app/policy/pdpx/apps/naming
          - name: xacml-properties
            mountPath: /opt/app/policy/pdpx/apps/naming/xacml.properties
            subPath: xacml.properties
          - name: policy-native
            mountPath: /opt/app/policy/pdpx/apps/native
          - name: xacml-properties
            mountPath: /opt/app/policy/pdpx/apps/native/xacml.properties
            subPath: xacml.properties
          - name: policy-optimization
            mountPath: /opt/app/policy/pdpx/apps/optimization
          - name: xacml-properties
            mountPath: /opt/app/policy/pdpx/apps/optimization/xacml.properties
            subPath: xacml.properties
          - name: logs
            mountPath: /var/log/onap
          - name: empty-dir
            mountPath: /tmp
            subPath: tmp-dir
          - mountPath: /opt/app/policy/pdpx/etc/logback.xml
            subPath: logback.xml
            name: pdpxconfig
          - mountPath: /opt/app/policy/pdpx/etc/mounted/config.json
            subPath: config.json
            name: pdpx-secret
          - mountPath: /etc/kafka-user
            name: kafka-user
            readOnly: true
          - mountPath: /etc/localtime
            name: localtime
            readOnly: true
          resources: {{ include "common.resources" . | nindent 12 }}
        {{- if .Values.nodeSelector }}
      nodeSelector:
{{ toYaml .Values.nodeSelector | indent 8 }}
        {{- end -}}
        {{- if .Values.affinity }}
      affinity:
{{ toYaml .Values.affinity | indent 8 }}
        {{- end }}
      serviceAccountName: {{ include "common.fullname" (dict "suffix" "read" "dot" . )}}
      volumes:
        - name: policy-guard
          emptyDir:
            sizeLimit: {{ .Values.dirSizes.policyDir.sizeLimit }}
        - name: policy-match
          emptyDir:
            sizeLimit: {{ .Values.dirSizes.policyDir.sizeLimit }}
        - name: policy-monitoring
          emptyDir:
            sizeLimit: {{ .Values.dirSizes.policyDir.sizeLimit }}
        - name: policy-naming
          emptyDir:
            sizeLimit: {{ .Values.dirSizes.policyDir.sizeLimit }}
        - name: policy-native
          emptyDir:
            sizeLimit: {{ .Values.dirSizes.policyDir.sizeLimit }}
        - name: policy-optimization
          emptyDir:
            sizeLimit: {{ .Values.dirSizes.policyDir.sizeLimit }}
        - name: empty-dir
          emptyDir:
            sizeLimit: {{ .Values.dirSizes.emptyDir.sizeLimit }}
        - name: logs
          emptyDir:
            sizeLimit: {{ .Values.dirSizes.logDir.sizeLimit }}
        - name: localtime
          emptyDir:
            sizeLimit: {{ .Values.dirSizes.emptyDir.sizeLimit }}
        - name: pdpxconfig
          configMap:
            name: {{ include "common.fullname" . }}-configmap
            defaultMode: 0755
        - name: pdpx-secret
          secret:
            secretName: {{ include "common.fullname" . }}-secret
        - name: xacml-properties
          secret:
            secretName: {{ tpl .Values.xacmlPropertiesSecret . }}
        - name: kafka-user
          secret:
            secretName: {{ include "common.name" . }}-ku
            items:
            - key: sasl.jaas.config
              path: sasl.jaas.config
      {{- include "common.imagePullSecrets" . | nindent 6 }}
